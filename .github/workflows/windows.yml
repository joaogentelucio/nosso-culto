name: Build Windows (Electron)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test transcription timing
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Build bundled Whisper and FFmpeg
        shell: pwsh
        run: ./scripts/prepare-transcription-windows.ps1
      - name: Package installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify native tools inside packaged Windows application
        shell: pwsh
        run: |
          $dir = 'release/win-unpacked/resources/transcription'
          foreach ($file in @('whisper-cli.exe','ffmpeg.exe')) {
            $exe = Join-Path $dir $file
            if (-not (Test-Path $exe)) { throw "Motor ausente no instalador: $exe" }
            $size = (Get-Item $exe).Length
            if ($size -lt 100000) { throw "Arquivo do motor incompleto: $exe ($size bytes)" }
            Write-Host "$file incluso no pacote ($size bytes)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nosso-culto-windows
          path: release/*.exe
          if-no-files-found: error
